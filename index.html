<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monica 工具頁面</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: #eef0f3;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 36px 40px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
h1 {
  font-size: 22px;
  color: #2c3e50;
  margin-bottom: 6px;
}
.sub {
  font-size: 13px;
  color: #888;
  margin-bottom: 28px;
}
.tool-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.tool-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  border: 1px solid #e2e6ea;
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.tool-item:hover {
  border-color: #4a90e2;
  box-shadow: 0 2px 8px rgba(74,144,226,0.15);
}
.icon {
  font-size: 28px;
  flex-shrink: 0;
}
.tool-info .name {
  font-size: 15px;
  font-weight: 600;
  color: #2c3e50;
  margin-bottom: 3px;
}
.tool-info .desc {
  font-size: 12px;
  color: #888;
}
footer {
  margin-top: 28px;
  font-size: 11px;
  color: #bbb;
  text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <h1>Monica 工具頁面</h1>
  <p class="sub">互動式電力系統計算工具</p>
  <div class="tool-list">
    <a class="tool-item" href="programming/other/fp_droop.html">
      <div class="icon">⚡</div>
      <div class="tool-info">
        <div class="name">F–P Droop Characteristic</div>
        <div class="desc">頻率–有功功率下垂控制計算與特性曲線</div>
      </div>
    </a>
    <a class="tool-item" href="programming/other/vq_droop.html">
      <div class="icon">🔋</div>
      <div class="tool-info">
        <div class="name">V–Q Droop Characteristic</div>
        <div class="desc">電壓–無效功率下垂控制計算與特性曲線</div>
      </div>
    </a>
  </div>
  <footer>Monica · 電力系統作業工具集</footer>
</div>
</body>
</html>
